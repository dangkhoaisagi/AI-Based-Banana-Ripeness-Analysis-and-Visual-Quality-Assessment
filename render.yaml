services:
  - type: web
    name: banana-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: KERAS_BACKEND
        value: tensorflow
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
